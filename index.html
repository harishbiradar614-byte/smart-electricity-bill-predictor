<!DOCTYPE html>
<html>
<head>
    <title>Smart Electricity Bill Predictor</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 20px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            padding: 12px;
            margin: 5px;
            width: 40%;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background: blue;
            color: white;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Smart Electricity Bill Predictor</h1>

    <h2>Add Monthly Record</h2>

    <input type="text" id="month" placeholder="Enter Month">

    <input type="number" id="units" placeholder="Units Consumed">

    <button id="addButton">Add Record</button>


    <h2>Bill History</h2>

    <table>

        <tr>
            <th>Month</th>
            <th>Units</th>
            <th>Bill</th>
        </tr>

        <tbody id="billHistory">
        </tbody>

    </table>


    <h2>Prediction</h2>

    <button id="predictButton">
        Predict Next Month Bill
    </button>

    <p id="prediction">
        Enter at least 3 months of data.
    </p>

</div>


<script>

let records = [];


/* Calculate Bill */

function calculateBill(units) {

    if (units <= 100) {

        return units * 3;

    }

    else if (units <= 200) {

        return (100 * 3) +
               (units - 100) * 5;

    }

    else {

        return (100 * 3) +
               (100 * 5) +
               (units - 200) * 7;

    }

}


/* Add Record */

document.getElementById("addButton").onclick = function() {

    let month =
        document.getElementById("month").value;

    let units =
        document.getElementById("units").value;


    if (month == "" || units == "") {

        alert("Please enter month and units.");

        return;

    }


    units = Number(units);


    let bill =
        calculateBill(units);


    records.push({

        month: month,

        units: units,

        bill: bill

    });


    let table =
        document.getElementById("billHistory");


    let row =
        table.insertRow();


    let cell1 =
        row.insertCell(0);

    let cell2 =
        row.insertCell(1);

    let cell3 =
        row.insertCell(2);


    cell1.innerHTML = month;

    cell2.innerHTML = units;

    cell3.innerHTML =
        "Rs. " + bill.toFixed(2);


    document.getElementById("month").value = "";

    document.getElementById("units").value = "";

};


/* Predict Bill */

document.getElementById("predictButton").onclick = function() {

    if (records.length < 3) {

        document.getElementById("prediction").innerHTML =
            "Enter at least 3 months of data.";

        return;

    }


    let n = records.length;


    let average =
        Math.floor(
            (
                records[n - 1].units +
                records[n - 2].units +
                records[n - 3].units
            ) / 3
        );


    let bill =
        calculateBill(average);


    document.getElementById("prediction").innerHTML =

        "<b>Predicted Units:</b> " +
        average +

        "<br><b>Estimated Bill:</b> Rs. " +
        bill.toFixed(2);

};

</script>

</body>
</html>
