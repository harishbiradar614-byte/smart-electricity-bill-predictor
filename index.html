<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Electricity Bill Predictor</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}
.box{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
}
input,button{
padding:10px;
margin:5px;
width:45%;
}
button{
background:#0D47A1;
color:white;
border:none;
cursor:pointer;
}
table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}
th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}
th{
background:#0D47A1;
color:white;
}
</style>
</head>

<body>

<div class="box">

<h2>Smart Electricity Bill Predictor</h2>

<input id="month" type="text" placeholder="Enter Month">
<input id="units" type="number" placeholder="Units">

<button onclick="addRecord()">Add Record</button>

<h3>Bill History</h3>

<table>
<thead>
<tr>
<th>Month</th>
<th>Units</th>
<th>Bill</th>
</tr>
</thead>
<tbody id="history"></tbody>
</table>

<button onclick="predictBill()">Predict Next Month</button>

<h3 id="result">Enter at least 3 records</h3>

</div>

<script>
let records=[];

function calculateBill(units){
if(units<=100)
return units*3;
else if(units<=200)
return 300+(units-100)*5;
else
return 800+(units-200)*7;
}

function addRecord(){

let month=document.getElementById("month").value;
let units=parseInt(document.getElementById("units").value);

if(month==""||isNaN(units)){
alert("Enter month and units");
return;
}

let bill=calculateBill(units);

records.push({
month:month,
units:units,
bill:bill
});

let table=document.getElementById("history");

let row=table.insertRow();

row.insertCell(0).innerHTML=month;
row.insertCell(1).innerHTML=units;
row.insertCell(2).innerHTML="Rs."+bill.toFixed(2);

document.getElementById("month").value="";
document.getElementById("units").value="";
}

function predictBill(){

if(records.length<3){
document.getElementById("result").innerHTML="Enter at least 3 records";
return;
}

let n=records.length;

let avg=Math.floor(
(records[n-1].units+
records[n-2].units+
records[n-3].units)/3
);

let bill=calculateBill(avg);

document.getElementById("result").innerHTML=
"Predicted Units : "+avg+
"<br>Estimated Bill : Rs."+bill.toFixed(2);

}
</script>

</body>
</html>
